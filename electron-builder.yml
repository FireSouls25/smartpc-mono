# electron-builder configuration.
#
# The renderer (dist/) and the Electron main process go into the ASAR archive;
# the Rust sidecar is an executable and must live OUTSIDE it, unpacked, at
# resources/bin/<name> — which is exactly where electron/main.cjs looks
# (`process.resourcesPath/bin`). scripts/build-release.mjs builds it with
# `cargo build --release` and stages it in release/staging/bin.
appId: co.smartpc.desktop
productName: Smart PC
copyright: Smart PC

directories:
  output: release/out
  buildResources: build

# Only what the app needs at runtime. Everything else (src, tests, scripts,
# node_modules dev deps) is left out of the archive.
files:
  - dist/**/*
  - electron/**/*
  - package.json

extraResources:
  - from: release/staging/bin
    to: bin
    filter:
      - "**/*"
      - "!**/.llama-build"
  # Vendored pi runtime (CLI + bridge + TTS daemon). The sidecar resolves
  # it under resources/pi-bridge and spawns the CLI via the local node.
  # Staged pruned per platform by scripts/build-release.mjs (step 3b).
  # Deps ride in pi-bridge-deps (NOT pi-bridge/node_modules): electron-builder
  # hard-drops a root node_modules under extraResources `from`, so the deps
  # are staged flat and mapped back to pi-bridge/node_modules via `to:`.
  - from: release/staging/pi-bridge
    to: pi-bridge
    filter:
      - "**/*"
      - "!**/*.test.js"
  - from: release/staging/pi-bridge-deps
    to: pi-bridge/node_modules

asar: true

# Per-OS installers. Override per run: `--dir`, `--target=AppImage`, etc.
# File names are lowercase, no spaces: smartpc-<os>-<arch>.<ext>.
# Only these land on the Releases page — electron-builder also writes
# update metadata (latest*.yml, *.blockmap, builder-debug.yml) into
# release/out/, but release.yml uploads just the installers below.
linux:
  target:
    - AppImage
    - tar.gz
  category: Utility
  # The sidecar needs a writable home for its db, models and vault; the
  # AppImage runs from a squashfs mount, so keep userData on $HOME (default).
  artifactName: smartpc-linux-${arch}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.utilities
  artifactName: smartpc-macos-${arch}.${ext}
  # Not signed: `npm run build-release -- --dir` still produces a runnable
  # .app locally; distributing needs a Developer ID + notarization.

win:
  target:
    - nsis
  artifactName: smartpc-windows-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
