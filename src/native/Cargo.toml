[package]
name = "smartpc-native"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "smartpc-native"
path = "src/main.rs"

[dependencies]
# HTTP layer: the standard async stack (local loopback API for the app).
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Auth crypto: argon2id for passwords, HS256 JWT for short access tokens.
argon2 = "0.5"
jsonwebtoken = "9"
# Opaque refresh tokens: OS randomness + SHA-256 storage hash.
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
# Local persistence: SQLite, C sources vendored (no system dependency).
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
email_address = "0.2"
# Local-model providers: OpenAI-compatible chat (Ollama, llama.cpp server).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
# Detached process groups for the embedded pi runtime (Unix setsid).
libc = "0.2"
# Local voice in (mic → VAD → whisper): needs cmake + a C++ compiler at
# build time (whisper.cpp is compiled from bundled sources), plus
# libasound2-dev on Linux (cpal/ALSA). See docs/09-voice.md.
cpal = "0.18"
whisper-rs = "0.16"
sysinfo = "0.39.6"
# T1 grounding: OS screen enumeration + capture (screenshots 0.2: full-display
# PNG only, no names/primary flags — see harness/screen.rs) + decode/downscale
# (image, PNG codec only; no model/ONNX).
screenshots = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
active-win-pos-rs = "0.11.0"
enigo = "0.6"
keyring = "4.2.0"
chacha20poly1305 = "0.10"
hkdf = "0.12"
