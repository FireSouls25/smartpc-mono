name: ci

# Fast checks on every push/PR. Release installers are NOT built here —
# per-OS binaries are built only on version-tag pushes by release.yml
# and attached to the GitHub Release.
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Native deps for `cargo test`: whisper.cpp needs cmake + C++;
      # cpal needs ALSA headers; keyring/secret-service needs dbus headers;
      # screenshots/enigo/active-win-pos need X11 headers at link time
      # (missing libX11/libXrandr/libxcb = "unable to find library" link
      # failure). Versions of Node/Rust come from .nvmrc / rust-toolchain.toml
      # so CI builds with exactly what dev uses.
      - run: >
          sudo apt-get update && sudo apt-get install -y
          cmake pkg-config
          libasound2-dev libdbus-1-dev
          libx11-dev libxrandr-dev libxcb1-dev
          libxtst-dev libxi-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Types + lint + format + unit; then sidecar suite + contract
      # (the contract spec spawns its own sidecar, no browsers needed).
      - run: npm run verify
      - run: cargo test --manifest-path src/native/Cargo.toml
      - run: npm run test:contract

  fast-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same native deps: the harness boots the sidecar via webServer,
      # which links the full native binary (needs the X11 headers too).
      - run: >
          sudo apt-get update && sudo apt-get install -y
          cmake pkg-config
          libasound2-dev libdbus-1-dev
          libx11-dev libxrandr-dev libxcb1-dev
          libxtst-dev libxi-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Fast path only: @slow (real model inference) stays local.
      - run: npm run test:e2e
