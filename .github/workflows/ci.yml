name: ci

# Fast checks on normal pushes/PRs only. Tag pushes (`v*`) skip this
# entirely — they run release.yml (build + publish) instead, so verify
# and e2e never run twice for the same commit.
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Native deps for `cargo test`: whisper.cpp needs cmake + C++;
      # cpal needs ALSA headers; keyring/secret-service needs dbus headers;
      # screenshots/enigo/active-win-pos need X11 headers at link time
      # (missing libX11/libXrandr/libxcb = "unable to find library" link
      # failure). Versions of Node/Rust come from .nvmrc / rust-toolchain.toml
      # so CI builds with exactly what dev uses.
      - run: >
          sudo apt-get update && sudo apt-get install -y
          cmake pkg-config
          libasound2-dev libdbus-1-dev
          libx11-dev libxrandr-dev libxcb1-dev
          libxtst-dev libxi-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vendored pi CLI + TTS engine: the contract spec boots a real
      # sidecar, which now spawns the vendored copy (no npx fallback in
      # CI). Cached: the tree is several hundred MB of npm payload.
      - name: Cache pi-bridge deps
        uses: actions/cache@v4
        id: pi-bridge
        with:
          path: pi-bridge/node_modules
          key: pi-bridge-${{ runner.os }}-${{ hashFiles('pi-bridge/package-lock.json') }}
      - name: Install pi-bridge deps
        if: steps.pi-bridge.outputs.cache-hit != 'true'
        run: npm --prefix pi-bridge ci --no-audit --no-fund
      # Types + lint + format + unit; then sidecar suite + contract
      # (the contract spec spawns its own sidecar, no browsers needed).
      - run: npm run verify
      - run: cargo test --manifest-path src/native/Cargo.toml
      - run: npm run test:contract

  fast-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same native deps: the harness boots the sidecar via webServer,
      # which links the full native binary (needs the X11 headers too).
      - run: >
          sudo apt-get update && sudo apt-get install -y
          cmake pkg-config
          libasound2-dev libdbus-1-dev
          libx11-dev libxrandr-dev libxcb1-dev
          libxtst-dev libxi-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache pi-bridge deps
        uses: actions/cache@v4
        id: pi-bridge
        with:
          path: pi-bridge/node_modules
          key: pi-bridge-${{ runner.os }}-${{ hashFiles('pi-bridge/package-lock.json') }}
      - name: Install pi-bridge deps
        if: steps.pi-bridge.outputs.cache-hit != 'true'
        run: npm --prefix pi-bridge ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Fast path only: @slow (real model inference) stays local.
      - run: npm run test:e2e
